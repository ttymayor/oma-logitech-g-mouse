name: Publish release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - Cargo.toml
      - Cargo.lock
      - src/**
      - bin/logitech-g-daemon
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Verify bundled controller matches locked source
        shell: bash
        env:
          BUILDER_IMAGE: rust@sha256:408fe88047cef61a2087653b0c5255fa51c0f2d6d94ddedd7a2562a9b91a46f6
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export CARGO_INCREMENTAL=0
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace \
            --env SOURCE_DATE_EPOCH \
            --env CARGO_INCREMENTAL \
            "$BUILDER_IMAGE" \
            bash -ceu 'cargo clean && cargo build --locked --release'
          cmp --silent target/release/logitech-g-daemon bin/logitech-g-daemon
          mkdir release-assets
          install -Dm755 bin/logitech-g-daemon release-assets/logitech-g-daemon
          sha256sum release-assets/logitech-g-daemon > release-assets/logitech-g-daemon.sha256
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg source_date_epoch "$SOURCE_DATE_EPOCH" \
            --arg builder_image "$BUILDER_IMAGE" \
            --arg cargo_lock_sha256 "$(sha256sum Cargo.lock | cut -d' ' -f1)" \
            --arg binary_sha256 "$(cut -d' ' -f1 release-assets/logitech-g-daemon.sha256)" \
            '{commit: $commit, source_date_epoch: $source_date_epoch, builder_image: $builder_image, cargo_lock_sha256: $cargo_lock_sha256, binary_sha256: $binary_sha256, verified_bundled_binary: true}' \
            > release-assets/provenance.json

      - name: Read and validate plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' manifest.json)"

          [[ "$version" != "null" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes \
            release-assets/logitech-g-daemon \
            release-assets/logitech-g-daemon.sha256 \
            release-assets/provenance.json
